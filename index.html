<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>de-tune</title>
		<script type="importmap">
			{
				"imports": {
					"lit": "https://esm.sh/lit@3",
					"lit/": "https://esm.sh/lit@3/",
					"tone": "https://esm.sh/tone@14.7.77"
				}
			}
		</script>
		<script type="module" src="./dist/de-tune.js"></script>
	</head>
	<body>
		<style
			contenteditable
			style="
				display: block;
				white-space: pre;
				border: 1px solid black;
				margin-block-end: 1rem;
			"
		>
			de-tune::part(base) {
				display: flex;
				gap: 1rem;
			}

			de-tune::part(note) {
				border: 1px solid black;
				cursor: pointer;
				font: inherit;
				margin: 0;
				padding: 1ch;
			}

			de-tune::part(notes) {
				margin-block-end: 1rem;
			}

			de-tune::part(play-all-container) {
				padding: 1rem;
			}

			de-tune::part(play-all) {
				font-family: monospace;
			}
		</style>
		<div>
			<de-tune notes="E2 Ab D3 G#3 B3 E4" playalldelay=".25" showfullnote>
				<span slot="play-all">Play All The Notes</span>
			</de-tune>
		</div>
		<div>
			<de-tune duration="8" notes="D2 A2 D3" disableplayall></de-tune>
		</div>
	</body>
</html>
